name: Nibras Agent CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-verify:
    name: GCC-13 Linux Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up GCC toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 build-essential python3 libsqlite3-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100
          gcc --version

      - name: Build & Run Deterministic Test Battery
        run: |
          make clean
          make all
          make verify

      - name: Verify Consecutive Clean Run
        run: |
          make clean
          make verify

      - name: Verify CLI Daemon Smoke Test
        run: |
          ./build/nibras_agent --demo
          ./build/nibras_agent --status
